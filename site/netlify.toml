[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonical URL scheme: extensionless. 301 the .html variants (WO-2).
[[redirects]]
  from = "/spray-polyurethane-foam-roofing.html"
  to = "/spray-polyurethane-foam-roofing"
  status = 301
  force = true
